# worker_bees settings
#
# This file stays on the worker computer: each machine has its own copy,
# so each one can say where the shared folders are from where it sits.
#
# top_level_directory is the shared folder that holds the required_folders
# required_folders are the folders necessary for the queue to run

top_level_directory = 'C:/worker_bees'
required_folders = ['001_queue', '002_running', '003_failed', '004_complete']

# queue_folder is where waiting jobs go (one of the required_folders)
queue_folder = '001_queue'

# forward_days is how many days ahead ZZZ_build_queue.py writes jobs,
# so the queue keeps going even if the nightly build misses a few nights
forward_days = 7

# where jobs go while they run, and where they end up afterwards
running_folder = '002_running'
failed_folder = '003_failed'
complete_folder = '004_complete'

# a job still running after this many minutes is stopped and marked failed
job_timeout_minutes = 240

# Workers running under Linux or WSL use this instead of top_level_directory,
# because Windows drives look different there (C:/ is /mnt/c/).
# Remove the # to use it.
# top_level_directory_linux = '/mnt/c/worker_bees'

# scripts_directory is where the job scripts are. The script named on the
# first line of a job file is looked up here first, then in the worker_bees
# folder. Put it on the shared folder so every worker runs the same scripts.
# Leave it out to use the worker_bees folder. Remove the # to use it.
# scripts_directory = '//server/share/worker_bees_scripts'

# Like top_level_directory_linux: used instead under Linux or WSL.
# scripts_directory_linux = '/mnt/worker_bees/worker_bees_scripts'
