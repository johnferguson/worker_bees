<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worker_bees schedule</title>
<style>
  :root {
    --bg: #fbf8f1; --panel: #ffffff; --ink: #2b2620; --muted: #776d60; --line: #e7dfd0;
    --honey: #f2a900; --honey-soft: #fff1c9; --honey-ink: #6b4a00;
    --bad: #c2412d; --bad-soft: #fde7e2; --good: #2f7d4f; --pause: #8a8178; --focus: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1915; --panel: #25221d; --ink: #f1ebe0; --muted: #a99f90; --line: #3a352d;
      --honey: #f5b82e; --honey-soft: #3d3218; --honey-ink: #f7d98a;
      --bad: #ff8a73; --bad-soft: #3d221d; --good: #7fd19f; --pause: #8f877c; --focus: #7aa7ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 20px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  h1 { font-size: 22px; margin: 0; }
  h1 span { color: var(--honey); }
  .file { color: var(--muted); font-size: 13px; word-break: break-all; }
  .totals { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 20px 14px; }
  .pill { background: var(--honey-soft); color: var(--honey-ink); border-radius: 999px; padding: 3px 12px; font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; gap: 16px; padding: 0 20px 30px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 0 12px 24px; } header, .totals { padding-left: 12px; padding-right: 12px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .list-head h2, .form h2 { font-size: 16px; margin: 0; }
  ul { list-style: none; margin: 0; padding: 6px; }
  li.job { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; padding: 9px 8px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
  li.job:hover { background: var(--bg); }
  li.job.selected { background: var(--honey-soft); border-color: var(--honey); }
  li.job.paused .script { color: var(--pause); text-decoration: line-through; }
  li.job.drop-before { border-top-color: var(--honey); }
  li.job.drop-after { border-bottom-color: var(--honey); }
  .grip { color: var(--muted); cursor: grab; user-select: none; font-size: 14px; letter-spacing: -2px; }
  .script { font-weight: 600; overflow-wrap: anywhere; }
  .cron { font: 12.5px ui-monospace, Consolas, monospace; color: var(--muted); }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .badge.often { background: var(--bg); color: var(--muted); }
  .badge.paused { background: var(--line); color: var(--ink); }
  .badge.error { background: var(--bad-soft); color: var(--bad); }
  .moves { display: flex; gap: 2px; }
  .moves button { padding: 0 6px; font-size: 12px; line-height: 20px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--honey); }
  button.primary { background: var(--honey); border-color: var(--honey); color: #2b2000; font-weight: 600; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .form { padding: 16px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  textarea { min-height: 54px; resize: vertical; }
  .row { margin-top: 14px; }
  .fields { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .fields input { font-family: ui-monospace, Consolas, monospace; text-align: center; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; text-align: center; }
  @media (max-width: 520px) { .fields { grid-template-columns: repeat(2, 1fr); } }
  .check { display: flex; gap: 8px; align-items: center; }
  .check input { width: auto; }
  .note { margin-top: 8px; font-size: 13px; padding: 7px 10px; border-radius: 8px; }
  .note.error { background: var(--bad-soft); color: var(--bad); }
  .note.warn { background: var(--honey-soft); color: var(--honey-ink); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .metric { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .metric b { display: block; font-size: 24px; line-height: 1.2; }
  .metric span { font-size: 12.5px; color: var(--muted); }
  .runs { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
  .actions .spacer { flex: 1; }
  .footnote { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1><span>&#9679;</span> worker_bees schedule</h1>
  <div class="file" id="file"></div>
</header>
<div class="totals" id="totals"></div>
<main>
  <section class="card" aria-label="Jobs">
    <div class="list-head"><h2>Jobs</h2><button class="primary" id="add">+ Add job</button></div>
    <ul id="list"></ul>
  </section>
  <section class="card form" id="form" aria-live="polite"></section>
</main>
<div id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;       // what the server last sent
let selected = null;    // index of the job being edited, or "new"
let dirty = false;      // the form has changes that aren't saved
let checkTimer = null;

const PRESETS = [
  ["Every weekday at 08:00", ["0", "8", "*", "*", "1-5"]],
  ["Every day at 06:00", ["0", "6", "*", "*", "*"]],
  ["Every hour, 07:00-17:00 on weekdays", ["0", "7-17", "*", "*", "1-5"]],
  ["Every 15 minutes", ["*/15", "*", "*", "*", "*"]],
  ["Every Monday at 09:00", ["0", "9", "*", "*", "1"]],
  ["1st of each month at 05:00", ["0", "5", "1", "*", "*"]],
];
const FIELD_HINTS = [["Minute", "0-59"], ["Hour", "0-23"], ["Day of month", "1-31"], ["Month", "1-12, jan"], ["Day of week", "0-6 Sun=0, mon"]];

function amount(n) {
  if (!n) return "0";
  if (Number.isInteger(n)) return n.toLocaleString();
  return "~" + (n < 10 ? n.toFixed(1) : Math.round(n).toLocaleString());
}
function when(iso) {
  return new Date(iso).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(message) {
  const t = $("toast"); t.textContent = message; t.classList.add("show");
  clearTimeout(t.timer); t.timer = setTimeout(() => t.classList.remove("show"), 3200);
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", body: JSON.stringify(body),
    headers: { "Content-Type": "application/json", "X-Worker-Bees": "1" },
  };
  const response = await fetch(path, options);
  return { status: response.status, data: await response.json() };
}

async function load() {
  const { data } = await api("/api/schedule");
  state = data;
  render();
}

function render() {
  $("file").textContent = state.file;
  const t = state.totals;
  $("totals").innerHTML = `<span class="pill">All running jobs: ${amount(t.per_day)} runs a day on average</span>
    <span class="pill">${amount(t.per_week)} a week</span><span class="pill">${amount(t.per_month)} a month</span>`;
  renderList();
  renderForm();
}

function renderList() {
  const list = $("list");
  if (!state.jobs.length) { list.innerHTML = `<li class="empty">No jobs yet. Add one to get started.</li>`; return; }
  list.innerHTML = state.jobs.map((job, i) => {
    const name = job.script || "(no script)";
    let badge = "";
    if (job.error) badge = `<span class="badge error">needs fixing</span>`;
    else if (job.paused) badge = `<span class="badge paused">paused</span>`;
    else badge = `<span class="badge often">${amount(job.often.per_day)} a day</span>`;
    return `<li class="job ${i === selected ? "selected" : ""} ${job.paused ? "paused" : ""}" draggable="true" data-i="${i}">
      <span class="grip" title="Drag to move">&#8942;&#8942;</span>
      <div><div class="script">${escapeHtml(name)}</div><div class="cron">${escapeHtml(job.fields.join(" "))}</div></div>
      <div style="display:grid;gap:4px;justify-items:end">${badge}
        <span class="moves"><button data-move="-1" aria-label="Move up" ${i === 0 ? "disabled" : ""}>&#9650;</button><button data-move="1" aria-label="Move down" ${i === state.jobs.length - 1 ? "disabled" : ""}>&#9660;</button></span>
      </div></li>`;
  }).join("");

  list.querySelectorAll("li.job").forEach((li) => {
    const i = Number(li.dataset.i);
    li.addEventListener("click", (event) => {
      const move = event.target.closest("[data-move]");
      if (move) { event.stopPropagation(); return moveJob(i, i + Number(move.dataset.move)); }
      choose(i);
    });
    li.addEventListener("dragstart", (event) => { event.dataTransfer.setData("text/plain", String(i)); event.dataTransfer.effectAllowed = "move"; });
    li.addEventListener("dragover", (event) => {
      event.preventDefault();
      li.classList.add("drop-before");
    });
    li.addEventListener("dragleave", () => li.classList.remove("drop-before", "drop-after"));
    li.addEventListener("drop", (event) => {
      event.preventDefault();
      li.classList.remove("drop-before", "drop-after");
      const from = Number(event.dataTransfer.getData("text/plain"));
      if (!Number.isNaN(from) && from !== i) moveJob(from, i);
    });
  });
}

function choose(index) {
  if (dirty && !confirm("Leave this job without saving your changes?")) return;
  selected = index; dirty = false;
  renderList(); renderForm();
  // on a narrow screen the form is below the list, so bring it into view
  if (window.matchMedia("(max-width: 760px)").matches) $("form").scrollIntoView({ behavior: "smooth" });
}

function blankJob() {
  return { fields: ["0", "8", "*", "*", "1-5"], script: "", description: "", paused: false };
}

function renderForm() {
  const form = $("form");
  if (selected === null) {
    form.innerHTML = `<div class="empty">Pick a job on the left to change it, or add a new one.<br><br>
      Every change is saved straight into the crontab file.</div>`;
    return;
  }
  const job = selected === "new" ? blankJob() : state.jobs[selected];
  form.innerHTML = `
    <h2>${selected === "new" ? "New job" : "Edit job"}</h2>
    <div class="row"><label for="script">Script</label>
      <input id="script" list="scripts" value="${escapeHtml(job.script)}" placeholder="jobs/report.py" autocomplete="off">
      <datalist id="scripts">${state.scripts.map((s) => `<option value="${escapeHtml(s)}">`).join("")}</datalist></div>
    <div class="row"><label for="preset">When it runs</label>
      <select id="preset"><option value="">Quick fill...</option>${PRESETS.map((p, i) => `<option value="${i}">${p[0]}</option>`).join("")}</select></div>
    <div class="row fields">${FIELD_HINTS.map(([name, hint], i) => `
      <div><input id="f${i}" value="${escapeHtml(job.fields[i])}" aria-label="${name}" spellcheck="false"><div class="hint">${name}<br>${hint}</div></div>`).join("")}</div>
    <div class="row"><label for="description">Description (saved as comment lines above the job)</label>
      <textarea id="description" placeholder="What this job does">${escapeHtml(job.description)}</textarea></div>
    <div class="row check"><input type="checkbox" id="paused" ${job.paused ? "checked" : ""}><label for="paused" style="margin:0;color:var(--ink)">Paused (kept in the file, but doesn't run)</label></div>
    <div id="preview"></div>
    <div class="actions">
      <button class="primary" id="save">${selected === "new" ? "Add to schedule" : "Save changes"}</button>
      <button id="cancel">${selected === "new" ? "Cancel" : "Undo changes"}</button>
      <span class="spacer"></span>
      ${selected === "new" ? "" : `<button class="danger" id="delete">Delete job</button>`}
    </div>
    <div class="footnote">Fields take <code>*</code>, numbers, lists <code>1,15</code>, ranges <code>1-5</code> and steps <code>*/15</code>.
      If both day fields are set, a day matching either one runs the job, as in cron.<br>
      Changes reach the queue at the next queue build, or straight away with <code>uv run ZZZ_build_queue.py</code>.</div>`;

  const inputs = ["script", "f0", "f1", "f2", "f3", "f4", "description", "paused"].map($);
  inputs.forEach((el) => el.addEventListener("input", () => { dirty = true; scheduleCheck(); }));
  $("preset").addEventListener("change", (event) => {
    const preset = PRESETS[event.target.value]; if (!preset) return;
    preset[1].forEach((v, i) => ($("f" + i).value = v));
    event.target.value = ""; dirty = true; scheduleCheck();
  });
  $("save").addEventListener("click", saveJob);
  $("cancel").addEventListener("click", () => { dirty = false; if (selected === "new") selected = null; renderList(); renderForm(); });
  if ($("delete")) $("delete").addEventListener("click", deleteJob);
  showPreview(selected === "new" ? null : job);
  if (selected === "new") { scheduleCheck(); $("script").focus(); }
}

function formJob() {
  return {
    fields: [0, 1, 2, 3, 4].map((i) => $("f" + i).value.trim()),
    script: $("script").value.trim(),
    description: $("description").value,
    paused: $("paused").checked,
  };
}

function scheduleCheck() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(async () => {
    if (!$("f0")) return;  // the form was closed in the meantime
    const { data } = await api("/api/check", formJob());
    showPreview(data);
  }, 250);
}

function showPreview(info) {
  const box = $("preview"); if (!box) return;
  if (!info) { box.innerHTML = ""; return; }
  if (info.error) { box.innerHTML = `<div class="note error">${escapeHtml(info.error)}</div>`; return; }
  const o = info.often;
  const paused = $("paused") && $("paused").checked;
  let html = "";
  if (info.script_found === false) html += `<div class="note warn">Can't find this script in ${escapeHtml(state.scripts_dir)} or the worker_bees folder on this computer. It may still exist on the workers.</div>`;
  if (o.per_week > 1000) html += `<div class="note warn">That's over 1,000 runs a week. Every run is a file in the queue, so this makes the queue folder busy.</div>`;
  if (paused) html += `<div class="note warn">Paused: these are the numbers once it's switched back on.</div>`;
  html += `<div class="metrics">
    <div class="metric"><b>${amount(o.per_day)}</b><span>runs a day<br>(on days it runs)</span></div>
    <div class="metric"><b>${amount(o.per_week)}</b><span>runs a week</span></div>
    <div class="metric"><b>${o.per_month >= 1 ? amount(o.per_month) : amount(o.per_year)}</b><span>${o.per_month >= 1 ? "runs a month" : "runs a year"}</span></div>
  </div>`;
  html += info.next_runs.length
    ? `<div class="row"><label>Next runs</label><ul class="runs">${info.next_runs.map((r) => `<li>${when(r)}</li>`).join("")}</ul></div>`
    : `<div class="note warn">This never runs in the next four years. Check the day and month.</div>`;
  box.innerHTML = html;
}

async function send(body, message) {
  clearTimeout(checkTimer);
  const { status, data } = await api("/api/save", { version: state.version, ...body });
  if (status === 409) { state = data.state; selected = null; dirty = false; render(); toast(data.error); return false; }
  if (status !== 200) { toast(data.error || "That didn't save."); if ($("preview")) showPreview({ error: data.error }); return false; }
  state = data.state; dirty = false;
  if (data.index !== undefined) selected = data.index;
  render(); toast(message);
  return true;
}

function saveJob() {
  const job = formJob();
  if (selected === "new") send({ action: "add", job }, "Added to the end of the schedule.");
  else send({ action: "update", index: selected, job }, "Saved.");
}

function deleteJob() {
  if (!confirm("Delete this job from the schedule?")) return;
  send({ action: "delete", index: selected }, "Deleted.").then((ok) => { if (ok) { selected = null; render(); } });
}

function moveJob(from, to) {
  if (to < 0 || to >= state.jobs.length) return;
  if (dirty && !confirm("Moving saves the new order now and drops your unsaved changes. Carry on?")) return;
  // keep the same job selected, wherever it ends up
  let next = selected;
  if (selected === from) next = to;
  else if (typeof selected === "number" && from < selected && to >= selected) next = selected - 1;
  else if (typeof selected === "number" && from > selected && to <= selected) next = selected + 1;
  send({ action: "move", index: from, to }, "Moved.").then((ok) => { if (ok) { selected = next; render(); } });
}

$("add").addEventListener("click", () => choose("new"));
window.addEventListener("beforeunload", (event) => { if (dirty) event.preventDefault(); });
load();
</script>
</body>
</html>
